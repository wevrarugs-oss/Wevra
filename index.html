.card .ph{aspect-ratio:3/4;overflow:hidden;position:relative;background:#e8e2d6}

.card img.loaded{opacity:1}.card:hover img{transform:scale(1.08)}

.no-scroll{overflow:hidden}
.chat{position:fixed;right:16px;bottom:16px;z-index:50}
#chatPanel{display:none;width:300px;background:#fff;border:1px solid var(--line);padding:16px;margin-bottom:10px;transform-origin:bottom right}
#chatPanel.open{display:block;animation:pop .3s cubic-bezier(.2,.8,.2,1)}

input,select,textarea{border:1px solid var(--line);padding:8px;width:100%;background:#fff;font:inherit;margin:2px 0 10px}
.tabs button{padding:6px 12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}

function compress(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=500/Math.max(im.width,im.height);if(s>1)s=1;var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var u=c.toDataURL('image/webp',.55);if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/jpeg',.6);cb(u)};im.src=r.result};r.readAsDataURL(file)}

for(i=0;i<list.length;i++)compress(list[i],function(u){editing.photos.push(u);done++;document.getElementById('prog').style.width=(done/list.length*100)+'%';if(done===list.length)renderForm()})}

return '<!DOCTYPE html>\n'+h.outerHTML}
function copyCode(){var s=buildExport();function fb(){var t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Copy failed — use Download')}document.body.removeChild(t)}
