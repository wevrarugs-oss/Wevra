<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roshan — Handknotted Afghan Rugs</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS ===== */
:root{--gold:#C5A059;--dark:#121212;--light:#FDFBF7;--accent:#8C2D19;--sale:#D9381E;--ease:cubic-bezier(.2,.8,.2,1);--head:'Cormorant Garamond',serif;--body:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);font-weight:300;background:var(--light);color:var(--dark);line-height:1.7;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--head);font-weight:500;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.small{font-size:11px;letter-spacing:.28em;text-transform:uppercase}
/* ===== BUTTONS ===== */
.btn{display:inline-block;border:1px solid var(--dark);background:var(--dark);color:var(--light);padding:14px 28px;border-radius:2px;cursor:pointer;font-size:11px;letter-spacing:.26em;text-transform:uppercase;transition:all .5s var(--ease);text-decoration:none}
.btn:hover{background:var(--gold);border-color:var(--gold)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.ghost:hover{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.btn.sm{padding:9px 16px}
.icon{width:42px;height:42px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:18px;transition:all .5s var(--ease)}
.icon:hover{color:var(--gold)}
input,select,textarea{width:100%;border:1px solid #d8d2c4;border-radius:2px;padding:11px 12px;background:#fff;font-size:16px}
label{display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;margin:14px 0 5px;color:#777}
/* ===== HEADER ===== */
#announce{background:var(--dark);color:var(--gold);text-align:center;padding:9px 12px;transition:all .6s var(--ease);overflow:hidden;max-height:60px}
#announce.gone{max-height:0;padding:0}
header{position:fixed;left:0;right:0;z-index:50;background:rgba(253,251,247,.94);backdrop-filter:blur(8px);border-bottom:1px solid #eee7d8;transition:top .6s var(--ease)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo span{font-family:'Cinzel',serif;letter-spacing:.34em;font-size:18px}
nav.desk{display:none;gap:30px}
nav.desk a{text-decoration:none;color:inherit;font-size:11px;letter-spacing:.24em;text-transform:uppercase}
nav.desk a:hover{color:var(--gold)}
.heart-count{font-size:10px;vertical-align:super;color:var(--sale)}
#drawer{position:fixed;inset:0 40% 0 0;background:var(--light);z-index:80;padding:80px 28px;transform:translateX(-102%);transition:transform .6s var(--ease)}
#drawer.open{transform:none}
#drawer a{display:block;padding:14px 0;border-bottom:1px solid #eee;text-decoration:none;color:inherit}
@media(min-width:900px){nav.desk{display:flex}#burger{display:none}}
/* ===== HERO ===== */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(rgba(18,18,18,.55),rgba(18,18,18,.65)),var(--heroimg,linear-gradient(135deg,#3a1d12,#8C2D19 55%,#C5A059));background-size:cover;background-position:center;padding:120px 22px 80px;position:relative}
.hero h1{font-size:clamp(40px,8vw,84px);margin:18px 0}
.hero p.sub{max-width:520px;margin:0 auto 34px;opacity:.9}
.hero .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.scroll{position:absolute;bottom:26px;left:50%;width:1px;height:46px;background:var(--gold);animation:drop 2s var(--ease) infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media(prefers-reduced-motion:reduce){.scroll{animation:none}}
/* ===== SECTIONS ===== */
section{padding:96px 0}
.title{text-align:center;margin-bottom:44px}
.title h2{font-size:clamp(30px,5vw,46px);margin-top:10px}
.tools{display:grid;gap:12px;margin-bottom:26px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{background:none;border:1px solid #d8d2c4;border-radius:2px;padding:8px 16px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:all .4s var(--ease)}
.tab.on{background:var(--dark);color:var(--light);border-color:var(--dark)}
@media(min-width:700px){.tools{grid-template-columns:1fr 200px}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr);gap:28px}}
/* ===== CARDS ===== */
.card{cursor:pointer}
.thumb{position:relative;aspect-ratio:3/4;overflow:hidden;background:#ece5d6}
.thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1);transition:opacity .8s var(--ease),transform 1.3s var(--ease)}
.thumb img.loaded{opacity:1}
.card:hover .thumb img{transform:scale(1.08)}
.badge{position:absolute;top:10px;left:10px;background:var(--sale);color:#fff;font-size:10px;letter-spacing:.14em;padding:3px 9px;border-radius:2px}
.badge.sold{background:var(--dark);top:auto;bottom:10px}
.wish{position:absolute;top:6px;right:6px;background:rgba(253,251,247,.9)}
.wish.on{color:var(--sale)}
.photos{position:absolute;bottom:10px;right:10px;font-size:10px;background:rgba(18,18,18,.7);color:#fff;padding:2px 8px;border-radius:2px}
.over{position:absolute;inset:auto 0 0 0;padding:16px;background:linear-gradient(transparent,rgba(18,18,18,.75));color:#fff;opacity:0;transition:opacity .6s var(--ease)}
.card:hover .over{opacity:1}
.card h3{font-size:21px;margin-top:12px}
.price s{color:#999;margin-right:8px}
.price b{font-weight:500}
.price .now.sale{color:var(--sale)}
/* ===== MODAL ===== */
.modal{position:fixed;inset:0;z-index:100;background:rgba(18,18,18,.7);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 12px}
.sheet{background:var(--light);width:100%;max-width:980px;border-radius:2px;position:relative;margin:auto;padding:24px}
.sheet .x{position:absolute;top:8px;right:8px;z-index:3}
.split{display:grid;gap:26px}
@media(min-width:800px){.split{grid-template-columns:1fr 1fr}}
.gal{aspect-ratio:3/4;background:#ece5d6;overflow:hidden;cursor:zoom-in}
.gal img{width:100%;height:100%;object-fit:cover}
.strip{display:flex;gap:8px;margin-top:8px}
.strip img{width:64px;height:64px;object-fit:cover;cursor:pointer;opacity:.5;border:1px solid transparent}
.strip img.on{opacity:1;border-color:var(--gold)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.specs div{border-top:1px solid #e6dfce;padding-top:8px}
.specs b{display:block;font-weight:400;font-size:15px}
.lightbox{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.lightbox img{max-width:100%;max-height:100%;transition:transform .5s var(--ease);transform-origin:center;animation:zin .6s var(--ease)}
@keyframes zin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.lbc{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.lbc button{background:rgba(255,255,255,.15);color:#fff}
/* ===== CONTENT SECTIONS ===== */
.heritage{background:#fff}
.stats{display:flex;gap:30px;margin:26px 0}
.stats b{font-family:var(--head);font-size:38px;color:var(--gold);display:block;font-weight:500}
.reviews{display:grid;gap:18px}
@media(min-width:800px){.reviews{grid-template-columns:repeat(3,1fr)}}
.rev{border:1px solid #e6dfce;padding:22px;border-radius:2px;background:#fff}
.stars{color:var(--gold);letter-spacing:3px}
.care{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;text-align:center}
@media(min-width:800px){.care{grid-template-columns:repeat(4,1fr)}}
.care .ic{font-size:28px;color:var(--gold);margin-bottom:8px}
footer{background:var(--dark);color:#d9d2c0;padding:70px 0 40px;text-align:center}
footer a{color:var(--gold);text-decoration:none}
.qnav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:24px 0}
#keybtn{opacity:.25;background:none;border:0;color:#fff;cursor:pointer;font-size:14px;padding:12px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--dark);color:#fff;padding:12px 22px;border-radius:2px;z-index:300;transition:transform .5s var(--ease);font-size:13px}
#toast.show{transform:translateX(-50%)}
/* ===== ADMIN + INLINE EDIT ===== */
body.adm [data-edit]{cursor:text}
body.adm [data-edit]:hover{outline:1px dashed var(--gold);outline-offset:4px}
.admbar{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 16px;border-bottom:1px solid #e6dfce}
.admbar button{background:none;border:0;padding:10px 12px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent}
.admbar button.on{border-color:var(--gold)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.row img{width:48px;height:60px;object-fit:cover}
.row .grow{flex:1;min-width:0}
.meter{height:8px;background:#eee;border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pics{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pics div{position:relative}
.pics img{width:80px;height:100px;object-fit:cover}
.pics button{position:absolute;top:2px;right:2px;background:#000;color:#fff;border:0;width:22px;height:22px;border-radius:50%;cursor:pointer}
.check{display:flex;gap:10px;align-items:center;font-size:14px;letter-spacing:0;text-transform:none;color:var(--dark);margin:8px 0}
.check input{width:auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toast"></div>
<script id="roshan-baked-data" type="application/json">null</script>
<script>
/* ===== STATE ===== */
var STORAGE_KEY = 'roshan_v9_data';
var DEFAULT_DATA = {
  settings: { pin: '1234', whatsapp: '93700000000', email: 'hello@roshanrugs.com', currency: '$' },
  theme: { gold: '#C5A059', dark: '#121212', light: '#FDFBF7', accent: '#8C2D19', heroImage: '', heritageImage: '', logo: '' },
  show: { hero: true, collection: true, heritage: true, reviews: true, care: true },
  content: {
    announcement: 'Complimentary worldwide shipping on every handknotted rug',
    brand: 'ROSHAN',
    heroKicker: 'Handknotted in Afghanistan',
    heroTitle: 'Rugs woven by light and patience',
    heroSubtitle: 'Each Roshan rug is knotted by hand, one thread at a time, in the weaving villages of northern Afghanistan.',
    heroCta1: 'View the collection',
    heroCta2: 'Our story',
    collectionTitle: 'The Collection',
    heritageKicker: 'Artisanship',
    heritageTitle: 'A craft older than the borders it crosses',
    heritageBody: 'Our weavers learned from their mothers, who learned from theirs. Every rug begins with wool shorn, spun and dyed by hand.\n\nA single rug can take months to complete. We pay our weavers fairly and bring their work directly to your home.',
    stat1n: '40+', stat1l: 'Weaving families',
    stat2n: '6 mo', stat2l: 'Longest rug',
    stat3n: '100%', stat3l: 'Hand knotted',
    reviewsTitle: 'Words from our collectors',
    careTitle: 'Caring for your rug',
    care: [
      { icon: '🧹', title: 'Vacuum gently', text: 'Use suction only, never a beater bar.' },
      { icon: '☀️', title: 'Rotate yearly', text: 'Even out sunlight and foot traffic.' },
      { icon: '💧', title: 'Blot spills', text: 'Press with a clean cloth. Never rub.' },
      { icon: '🧺', title: 'Clean professionally', text: 'Every 2–3 years by a wool specialist.' }
    ],
    footerText: 'Handknotted Afghan rugs, sent from our family to yours.',
    whatsappMessage: 'Hello Roshan, I would like to ask about a rug.'
  },
  rugs: [
    { id: 'r1', title: 'Kunduz Ember', price: 1850, discount: 10, dimensions: '2.4 × 3.1 m', origin: 'Kunduz', category: 'Tribal', status: 'available', description: 'Deep madder reds with a hand-spun wool pile.', photos: [], createdAt: 3 },
    { id: 'r2', title: 'Herat Garden', price: 2400, discount: 0, dimensions: '2.0 × 3.0 m', origin: 'Herat', category: 'Traditional', status: 'available', description: 'A walled garden pattern in soft gold and ivory.', photos: [], createdAt: 2 },
    { id: 'r3', title: 'Mazar Dusk', price: 980, discount: 0, dimensions: '1.5 × 2.2 m', origin: 'Mazar-i-Sharif', category: 'Modern', status: 'sold', description: 'Muted indigo geometry on a natural wool field.', photos: [], createdAt: 1 }
  ],
  reviews: [
    { id: 'v1', rugId: 'r1', name: 'Amelia R.', stars: 5, text: 'Even more beautiful in person. The wool feels alive.', date: 3 },
    { id: 'v2', rugId: 'r2', name: 'Daniel K.', stars: 5, text: 'Arrived beautifully packed and the owner was kind throughout.', date: 2 },
    { id: 'v3', rugId: 'r3', name: 'Sofia M.', stars: 4, text: 'Subtle, calm and well made. It anchors our living room.', date: 1 }
  ]
};
var state = null;
var view = { filter: 'All', search: '', sort: 'new' };
var wishlist = [];
var admin = false;
var adminTab = 'inv';
var editing = null;
var openRugId = null;

/* ===== HELPERS ===== */
function $(selector, root) { return (root || document).querySelector(selector); }
function clone(value) { return JSON.parse(JSON.stringify(value)); }
function isPlainObject(value) { return value !== null && typeof value === 'object' && !Array.isArray(value); }
function esc(text) {
  return String(text === undefined || text === null ? '' : text).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function money(amount) { return state.settings.currency + Number(amount).toLocaleString(); }
function salePrice(rug) { return Math.round(rug.price * (100 - (rug.discount || 0)) / 100); }
function findRug(id) { return state.rugs.filter(function (r) { return r.id === id; })[0]; }
function toast(message) {
  var el = $('#toast'); el.textContent = message; el.className = 'show';
  setTimeout(function () { el.className = ''; }, 2200);
}
function newId(prefix) { return prefix + Date.now().toString(36) + Math.floor(Math.random() * 999); }

/* ===== DATA SAFETY ===== */
function deepMerge(base, override) {
  if (override === undefined || override === null) { return base; }
  if (typeof override === 'string' && override === '' && typeof base === 'string' && base !== '') { return base; }
  if (!isPlainObject(base) || !isPlainObject(override)) { return override; }
  var result = {};
  Object.keys(base).forEach(function (key) { result[key] = deepMerge(base[key], override[key]); });
  Object.keys(override).forEach(function (key) { if (!(key in result)) { result[key] = override[key]; } });
  return result;
}
function restoreBlankDefaults() {
  ['settings', 'content'].forEach(function (group) {
    Object.keys(DEFAULT_DATA[group]).forEach(function (key) {
      var fallback = DEFAULT_DATA[group][key];
      var current = state[group][key];
      if (typeof fallback === 'string' && (typeof current !== 'string' || current.replace(/\s/g, '') === '')) { state[group][key] = fallback; }
    });
  });
  ['gold', 'dark', 'light', 'accent'].forEach(function (key) { if (!state.theme[key]) { state.theme[key] = DEFAULT_DATA.theme[key]; } });
  if (!Array.isArray(state.content.care) || !state.content.care.length) { state.content.care = clone(DEFAULT_DATA.content.care); }
}
function cleanupOldStorage() {
  try {
    Object.keys(localStorage).forEach(function (key) {
      if (/^roshan/i.test(key) && key !== STORAGE_KEY) { localStorage.removeItem(key); }
    });
  } catch (error) { /* storage unavailable */ }
}
function loadState() {
  var saved = null;
  var baked = null;
  try { baked = JSON.parse($('#roshan-baked-data').textContent); } catch (error) { baked = null; }
  try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (error) { saved = null; }
  state = deepMerge(clone(DEFAULT_DATA), baked || {});
  if (saved) { state = deepMerge(state, saved); }
  restoreBlankDefaults();
}
function saveState() {
  restoreBlankDefaults();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
  catch (error) { toast('Storage is full. Remove some photos.'); return false; }
}

/* ===== SCROLL SAFETY ===== */
function forceUnlockScroll() {
  [document.body, document.documentElement].forEach(function (node) {
    node.style.overflow = ''; node.style.position = ''; node.style.height = ''; node.style.pointerEvents = '';
  });
}
function lockScroll() { document.body.style.overflow = 'hidden'; }
function scrollToId(id) {
  forceUnlockScroll();
  var el = document.getElementById(id);
  if (el) { el.scrollIntoView({ behavior: 'smooth' }); }
}

/* ===== THEME ===== */
function applyTheme() {
  var root = document.documentElement.style;
  root.setProperty('--gold', state.theme.gold);
  root.setProperty('--dark', state.theme.dark);
  root.setProperty('--light', state.theme.light);
  root.setProperty('--accent', state.theme.accent);
  root.setProperty('--heroimg', state.theme.heroImage ? 'url(' + state.theme.heroImage + ')' : '');
  if (!state.theme.heroImage) { root.removeProperty('--heroimg'); }
}

/* ===== RENDERING: STOREFRONT ===== */
var LOGO_SVG = '<svg width="34" height="34" viewBox="0 0 40 40" fill="none" stroke="#C5A059" stroke-width="1.4"><rect x="3" y="3" width="34" height="34"/><path d="M20 6 34 20 20 34 6 20Z"/><path d="M20 13 27 20 20 27 13 20Z" fill="#C5A059"/></svg>';
function editable(path, text, tag) {
  return '<' + (tag || 'span') + ' data-edit="' + path + '">' + esc(text) + '</' + (tag || 'span') + '>';
}
function paragraphs(text) {
  return String(text).split(/\n\n+/).map(function (p) { return '<p style="margin-bottom:14px">' + esc(p) + '</p>'; }).join('');
}
function visibleRugs() {
  var term = view.search.toLowerCase();
  var list = state.rugs.filter(function (rug) {
    var inCategory = view.filter === 'All' || rug.category === view.filter;
    var matches = !term || (rug.title + ' ' + rug.origin + ' ' + rug.description).toLowerCase().indexOf(term) > -1;
    return inCategory && matches;
  });
  list.sort(function (a, b) {
    if (view.sort === 'low') { return salePrice(a) - salePrice(b); }
    if (view.sort === 'high') { return salePrice(b) - salePrice(a); }
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
  return list;
}
function categories() {
  var names = ['All'];
  state.rugs.forEach(function (rug) { if (rug.category && names.indexOf(rug.category) < 0) { names.push(rug.category); } });
  return names;
}
function placeholderArt() {
  return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><rect width="300" height="400" fill="#e8dcc4"/><path d="M150 60 250 200 150 340 50 200Z" fill="none" stroke="#8C2D19" stroke-width="3"/><path d="M150 120 200 200 150 280 100 200Z" fill="#C5A059"/></svg>');
}
function cardHtml(rug) {
  var liked = wishlist.indexOf(rug.id) > -1;
  var cover = rug.photos && rug.photos.length ? rug.photos[0] : placeholderArt();
  var priceHtml = rug.discount > 0
    ? '<s>' + money(rug.price) + '</s><b class="now sale">' + money(salePrice(rug)) + '</b>'
    : '<b class="now">' + money(rug.price) + '</b>';
  return '<article class="card" data-act="open" data-id="' + rug.id + '"><div class="thumb">' +
    '<img alt="' + esc(rug.title) + '" src="' + cover + '" onload="this.className=\'loaded\'">' +
    (rug.discount > 0 && rug.status !== 'sold' ? '<span class="badge">-' + rug.discount + '%</span>' : '') +
    (rug.status === 'sold' ? '<span class="badge sold">Sold</span>' : '') +
    '<button class="icon wish' + (liked ? ' on' : '') + '" data-act="wish" data-id="' + rug.id + '" aria-label="Wishlist">' + (liked ? '♥' : '♡') + '</button>' +
    (rug.photos && rug.photos.length > 1 ? '<span class="photos">' + rug.photos.length + ' photos</span>' : '') +
    '<div class="over small">' + esc(rug.dimensions) + '</div></div>' +
    '<h3>' + esc(rug.title) + '</h3><div class="price">' + priceHtml + '</div></article>';
}
function gridHtml() {
  var list = visibleRugs();
  if (!list.length) { return '<p style="grid-column:1/-1;text-align:center;color:#888">No rugs match your search.</p>'; }
  return list.map(cardHtml).join('');
}
function recentReviews(limit) {
  return state.reviews.slice().sort(function (a, b) { return b.date - a.date; }).slice(0, limit);
}
function starsText(count) { return new Array(count + 1).join('★') + new Array(6 - count).join('☆'); }
function whatsappLink(message) {
  return 'https://wa.me/' + String(state.settings.whatsapp).replace(/\D/g, '') + '?text=' + encodeURIComponent(message);
}
function renderStore() {
  var c = state.content;
  var navLinks = '<a href="#collection" data-act="go" data-id="collection">Collection</a><a href="#heritage" data-act="go" data-id="heritage">Heritage</a><a href="#care" data-act="go" data-id="care">Care</a>';
  var logoMark = state.theme.logo ? '<img src="' + state.theme.logo + '" alt="" style="height:34px">' : LOGO_SVG;
  var html = '<div id="announce" class="small">' + editable('content.announcement', c.announcement) + '</div>' +
    '<header id="hdr"><div class="wrap bar"><button class="icon" id="burger" data-act="drawer" aria-label="Menu">☰</button>' +

function openLightbox(id, index) {
  var rug = findRug(id); var src = rug.photos.length ? rug.photos[index] : placeholderArt();
  var scale = 1, tx = 0, ty = 0, lastX = 0, lastY = 0, startDist = 0, startScale = 1;
  var box = document.createElement('div'); box.className = 'lightbox';
  box.innerHTML = '<img src="' + src + '" alt=""><div class="lbc"><button class="icon" data-lb="in">+</button><button class="icon" data-lb="out">−</button><button class="icon" data-lb="reset">⟲</button><button class="icon" data-lb="close">✕</button></div>';
  document.body.appendChild(box);
  var image = box.querySelector('img');
  function paint() { image.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; }
  function distance(touches) { return Math.sqrt(Math.pow(touches[0].clientX - touches[1].clientX, 2) + Math.pow(touches[0].clientY - touches[1].clientY, 2)); }
  box.addEventListener('click', function (event) {
    var action = event.target.getAttribute('data-lb');
    if (action === 'in') { scale = Math.min(5, scale + .5); }
    if (action === 'out') { scale = Math.max(1, scale - .5); }
    if (action === 'reset') { scale = 1; tx = 0; ty = 0; }
    if (action === 'close' || event.target === box) { box.remove(); forceUnlockScroll(); if ($('#overlay').innerHTML) { lockScroll(); } return; }
    paint();
  });
  box.addEventListener('touchstart', function (event) {
    if (event.touches.length === 2) { startDist = distance(event.touches); startScale = scale; }
    else { lastX = event.touches[0].clientX; lastY = event.touches[0].clientY; }
  });
  box.addEventListener('touchmove', function (event) {
    event.preventDefault();
    image.style.transition = 'none';
    if (event.touches.length === 2) { scale = Math.max(1, Math.min(5, startScale * distance(event.touches) / startDist)); }
    else if (scale > 1) { tx += event.touches[0].clientX - lastX; ty += event.touches[0].clientY - lastY; lastX = event.touches[0].clientX; lastY = event.touches[0].clientY; }
    paint();
  }, { passive: false });
  box.addEventListener('touchend', function () { image.style.transition = ''; });
}

function compressImage(file, callback) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var ratio = Math.min(1, 500 / Math.max(img.width, img.height));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * ratio); canvas.height = Math.round(img.height * ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      var output = canvas.toDataURL('image/webp', 0.55);
      if (output.indexOf('data:image/webp') !== 0) { output = canvas.toDataURL('image/jpeg', 0.55); }
      callback(output);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function handleAction(act, target) {
  var id = target.getAttribute('data-id');
  var index = Number(target.getAttribute('data-i'));
  if (act === 'open') { openRug(id); }
  else if (act === 'wish') { toggleWish(id); if (openRugId) { openRug(openRugId); } else { refreshGrid(); } }
  else if (act === 'photo') { openRug(id, index); }
  else if (act === 'zoom') { openLightbox(id, index); }
  else if (act === 'close') { closeModal(); }
  else if (act === 'drawer') { $('#drawer').classList.toggle('open'); }
  else if (act === 'go') { $('#drawer').classList.remove('open'); scrollToId(id); }
  else if (act === 'filter') { view.filter = id; refreshGrid(); }
  else if (act === 'wishlist') { openWishlist(); }
  else if (act === 'wishremove') { toggleWish(id); openWishlist(); refreshGrid(); }
  else if (act === 'wishclear') { wishlist = []; refreshWishCount(); closeModal(); refreshGrid(); }
  else if (act === 'admin') { if (admin) { renderAdmin(); } else { unlockAdmin(); } }
  else { handleAdminAction(act, id, index); }
}
function handleAdminAction(act, id, index) {
  if (act === 'tab') { syncFormToEditing(); captureAdminFields(); adminTab = id; renderAdmin(); }
  else if (act === 'lock') { applyAndSave(); lockAdmin(); }
  else if (act === 'newrug') { editing = { id: newId('r'), isNew: true, title: '', price: 0, discount: 0, dimensions: '', origin: '', category: 'Traditional', status: 'available', description: '', photos: [], createdAt: Date.now() }; renderAdmin(); }
  else if (act === 'editrug') { editing = clone(findRug(id)); renderAdmin(); }
  else if (act === 'cancelrug') { editing = null; renderAdmin(); }
  else if (act === 'delphoto') { syncFormToEditing(); editing.photos.splice(index, 1); renderAdmin(); }
  else if (act === 'saverug') { saveRug(); }
  else if (act === 'delrug') { if (window.confirm('Delete this rug?')) { state.rugs = state.rugs.filter(function (r) { return r.id !== id; }); saveState(); renderStore(); renderAdmin(); } }
  else if (act === 'addreview') { addReview(); }
  else if (act === 'delreview') { state.reviews = state.reviews.filter(function (r) { return r.id !== id; }); saveState(); renderStore(); renderAdmin(); }
  else if (act === 'preset') { state.theme.gold = PRESETS[id].gold; state.theme.dark = PRESETS[id].dark; state.theme.light = PRESETS[id].light; state.theme.accent = PRESETS[id].accent; applyTheme(); saveState(); renderAdmin(); }
  else if (act === 'cleanold') { cleanupOldStorage(); toast('Old data removed'); }
  else if (act === 'nophotos') { if (window.confirm('Remove every rug photo?')) { state.rugs.forEach(function (r) { r.photos = []; }); saveState(); renderStore(); renderAdmin(); } }
  else if (act === 'erase') { if (window.confirm('Erase everything and restore defaults?')) { state = clone(DEFAULT_DATA); saveState(); applyTheme(); renderStore(); renderAdmin(); } }
  else if (act === 'copycode') { captureAdminFields(); restoreBlankDefaults(); saveState(); copyText(buildExportHtml()); }
  else if (act === 'download') { captureAdminFields(); saveState(); downloadFile('index.html', buildExportHtml(), 'text/html'); }
  else if (act === 'backup') { captureAdminFields(); downloadFile('roshan-backup.json', JSON.stringify(state), 'application/json'); }
}
function saveRug() {
  syncFormToEditing();
  if (!editing.title.replace(/\s/g, '')) { toast('Add a title first'); return; }
  var record = clone(editing); delete record.isNew;
  var existing = findRug(record.id);
  if (existing) { state.rugs[state.rugs.indexOf(existing)] = record; } else { state.rugs.unshift(record); }
  editing = null;
  if (saveState()) { toast('Saved'); }
  renderStore(); renderAdmin();
}
function addReview() {
  var text = $('#nrText').value; var name = $('#nrName').value;
  if (!text || !name) { toast('Add a name and review'); return; }
  state.reviews.push({ id: newId('v'), rugId: $('#nrRug').value, name: name, stars: Math.max(1, Math.min(5, Number($('#nrStars').value) || 5)), text: text, date: Date.now() });
  saveState(); renderStore(); renderAdmin();
}
function bindEvents() {
  document.addEventListener('click', function (event) {
    var target = event.target;
    while (target && target !== document && !target.getAttribute('data-act')) { target = target.parentNode; }
    if (!target || target === document) { return; }
    var act = target.getAttribute('data-act');
    if (act === 'backdrop') { if (event.target === target) { if (admin) { applyAndSave(); } closeModal(); } return; }
    event.preventDefault();
    if (act === 'wish' || act === 'close') { event.stopPropagation(); }
    handleAction(act, target);
  });
  document.addEventListener('change', function (event) {
    var node = event.target;
    if (node.id === 'sort') { view.sort = node.value; refreshGrid(); }
    else if (node.id === 'rugphoto') { addRugPhotos(node.files); }
    else if (node.getAttribute('data-img')) { setThemeImage(node.getAttribute('data-img'), node.files[0]); }
    else if (node.id === 'importfile') { importBackup(node.files[0]); }
  });
  document.addEventListener('input', function (event) {
    if (event.target.id === 'search') { view.search = event.target.value; refreshGrid(); }
  });
  document.addEventListener('keydown', function (event) {
    if (event.ctrlKey && event.shiftKey && (event.key === 'A' || event.key === 'a')) { event.preventDefault(); if (admin) { renderAdmin(); } else { unlockAdmin(); } }
    if (event.key === 'Escape') { closeModal(); }
  });
  window.addEventListener('scroll', function () {
    $('#announce').classList.toggle('gone', window.scrollY > 40);
    var header = $('#hdr'); if (header) { header.style.top = $('#announce').classList.contains('gone') ? '0' : $('#announce').offsetHeight + 'px'; }
  });
}
function addRugPhotos(files) {
  syncFormToEditing();
  var room = 3 - editing.photos.length;
  var queue = Array.prototype.slice.call(files, 0, room);
  if (!queue.length) { toast('Maximum 3 photos'); renderAdmin(); return; }
  var pending = queue.length;
  queue.forEach(function (file) {
    compressImage(file, function (data) {
      editing.photos.push(data); pending -= 1;
      if (pending === 0) { renderAdmin(); }
    });
  });
}
function setThemeImage(key, file) {
  if (!file) { return; }
  compressImage(file, function (data) { state.theme[key] = data; applyAndSave(); renderAdmin(); });
}
function importBackup(file) {
  if (!file) { return; }
  var reader = new FileReader();
  reader.onload = function () {
    try { state = deepMerge(clone(DEFAULT_DATA), JSON.parse(reader.result)); restoreBlankDefaults(); saveState(); applyTheme(); renderStore(); renderAdmin(); toast('Backup imported'); }
    catch (error) { toast('That file is not a valid backup'); }
  };
  reader.readAsText(file);
}

/* ===== INIT ===== */
function init() {
  forceUnlockScroll();
  cleanupOldStorage();
  loadState();
  applyTheme();
  renderStore();
  bindEvents();
  console.log('Roshan storefront ready');
}
init();
</script>
</body>
